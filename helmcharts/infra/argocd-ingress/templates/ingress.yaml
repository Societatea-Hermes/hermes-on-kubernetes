apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ui
  annotations:
    # Group-gated (sa@ / developers@) via oauth2-proxy ForwardAuth.
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-forward-auth-signin@kubernetescrd,oauth2-proxy-forward-auth-staff@kubernetescrd
  # argocd-server runs with server.insecure=true so Traefik terminates TLS and
  # routes to its HTTP port.
spec:
  tls:
    - secretName: argocd-server-tls
  ingressClassName: traefik
  rules:
  - host: argocd.societatea-hermes.ro
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: argocd-server
            port:
              name: http
