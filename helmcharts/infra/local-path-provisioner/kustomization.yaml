# Upstream local-path-provisioner, patched for Talos (see the Talos "Local
# Storage" guide). Every PersistentVolume lives on the data disk of the storage
# worker, which Talos mounts at /var/mnt/local-path-provisioner (see
# terraform/kubernetes-cluster/storage.tf and talos-config.tf).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github.com/rancher/local-path-provisioner/deploy?ref=v0.0.37
patches:
  - patch: |-
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":["/var/mnt/local-path-provisioner"]
                  }
                  ]
          }
  - patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
          # "local" PVs fail to mount if the data disk isn't mounted yet,
          # instead of silently writing to the node's OS disk.
          defaultVolumeType: local
      parameters:
        # Pin PVs to the `storage=local` label instead of the hostname, so
        # they still match after the storage VM is rebuilt.
        nodeAffinityKey: storage
      # Only provision on the node that has the data disk.
      allowedTopologies:
        - matchLabelExpressions:
            - key: storage
              values: ["local"]
      # Keep the data when a PVC is deleted; clean up released PVs by hand.
      reclaimPolicy: Retain
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged
