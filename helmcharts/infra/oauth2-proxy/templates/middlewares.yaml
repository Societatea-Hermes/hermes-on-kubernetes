# Traefik ForwardAuth wiring for oauth2-proxy (replaces the old nginx
# auth-url / auth-signin annotations). Protected ingresses reference these
# cross-namespace as "<namespace>-<name>@kubernetescrd" (Traefik's
# providers.kubernetesCRD.allowCrossNamespace is enabled).
#
# Attach to a protected Ingress with, e.g.:
#   traefik.ingress.kubernetes.io/router.middlewares: >-
#     oauth2-proxy-forward-auth-signin@kubernetescrd,oauth2-proxy-forward-auth@kubernetescrd
# The signin (errors) middleware must come FIRST so it can catch the 401 the
# forward-auth middleware returns for an unauthenticated request.
---
# Any authenticated @societatea-hermes.ro user.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Preferred-Username
---
# Staff only: must be in the sa@ or developers@ group.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-staff
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth?allowed_groups=sa@societatea-hermes.ro,developers@societatea-hermes.ro
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Preferred-Username
---
# On a 401 from forward-auth, answer with oauth2-proxy's sign_in response
# instead: with --skip-provider-button that's a redirect to Google. Traefik
# keeps the sign_in response's headers (Location, the CSRF cookie) but forces
# the original status, so turn the 401 into a 302 or browsers won't follow it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-signin
  namespace: oauth2-proxy
spec:
  errors:
    status:
      - "401"
    statusRewrites:
      "401": 302
    service:
      name: oauth2-proxy
      port: 4180
    query: "/oauth2/sign_in?rd={url}"
