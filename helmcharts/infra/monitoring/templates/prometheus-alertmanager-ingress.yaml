apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-alertmanager
  namespace: monitoring
  annotations:
    # Group-gated (sa@ / developers@) via oauth2-proxy ForwardAuth.
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-forward-auth-signin@kubernetescrd,oauth2-proxy-forward-auth-staff@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: prometheus-tls
    - secretName: alertmanager-tls
  rules:
    - host: prometheus.societatea-hermes.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-prometheus
                port: 
                  name: http-web
    - host: alertmanager.societatea-hermes.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-alertmanager
                port: 
                  name: http-web