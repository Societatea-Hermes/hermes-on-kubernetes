apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
  annotations:
    # Group-gated via oauth2-proxy; the X-Auth-Request-* headers it sets feed
    # Grafana's auth.proxy. NOTE: the old nginx snippet also computed
    # X-Auth-Request-Role from the user's groups — that logic is gone, so users
    # may land with Grafana's default role until role mapping is reintroduced.
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-forward-auth-signin@kubernetescrd,oauth2-proxy-forward-auth-staff@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: grafana-tls
  rules:
    - host: grafana.societatea-hermes.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port: 
                  name: http-web