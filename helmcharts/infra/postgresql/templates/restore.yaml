{{- if .Values.restore_backup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
spec:
  template:
    spec:
      initContainers:
        - name: download
          image: mcr.microsoft.com/azure-cli:2.90.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              az login --identity --allow-no-subscriptions -o none
              az storage blob download --auth-mode login -o none \
                --account-name {{ .Values.backup.storageAccount }} \
                --container-name {{ .Values.backup.container }} \
                --name {{ .Values.restore_backup.date }}.sql.gz \
                --file /backups/dump.sql.gz
          volumeMounts:
            - name: backup
              mountPath: /backups
      containers:
        - name: pg-restore
          image: postgres:16.15-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              gunzip -c /backups/dump.sql.gz | psql -h postgres.database.svc.cluster.local -d postgres
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
          volumeMounts:
            - name: backup
              mountPath: /backups
      restartPolicy: OnFailure
      volumes:
        - name: backup
          emptyDir: {}
{{- end }}
