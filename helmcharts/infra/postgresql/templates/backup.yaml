apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backups
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          initContainers:
          - name: pg-dump
            image: postgres:16.15-alpine
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                pg_dumpall --clean -h postgres.database.svc.cluster.local | gzip > /backups/$(date +'%Y-%m-%d').sql.gz
            env:
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-credentials
                    key: POSTGRES_PASSWORD
              - name: PGUSER
                valueFrom:
                  secretKeyRef:
                    name: postgres-credentials
                    key: POSTGRES_USER
            volumeMounts:
              - name: backup
                mountPath: /backups
          containers:
          # Logs in as the VMs' managed identity (terraform/kubernetes-cluster/identity.tf),
          # so no storage keys are needed. Old backups are expired by the storage
          # account's lifecycle policy (see deploy.sh).
          - name: upload
            image: mcr.microsoft.com/azure-cli:2.90.0
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                az login --identity --allow-no-subscriptions -o none
                for f in /backups/*.sql.gz; do
                  az storage blob upload --auth-mode login --overwrite -o none \
                    --account-name {{ .Values.backup.storageAccount }} \
                    --container-name {{ .Values.backup.container }} \
                    --file "$f" --name "$(basename "$f")"
                  echo "Uploaded $(basename "$f")"
                done
            volumeMounts:
              - name: backup
                mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir: {}
