apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  controller.diff.server.side: "true"
  # Serve the API/UI over plain HTTP; Traefik terminates TLS at the ingress.
  # (Replaces the old nginx ssl-passthrough to argocd-server's self-signed cert.)
  server.insecure: "true"