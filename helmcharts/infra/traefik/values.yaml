traefik:
  # Runs as a DaemonSet pinned to the master, which holds the single public IP,
  # with only :80 and :443 bound on the node (hostPort). Everything else
  # (dashboard, metrics) stays inside the pod network. No Azure LoadBalancer.
  deployment:
    kind: DaemonSet
  # Only one pod can hold the node's :80/:443 at a time, so the rollout must
  # free the ports before starting the replacement.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  nodeSelector:
    type: master
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Traefik listens on 8000/8443 inside the pod (the chart defaults, fine for
  # its non-root user); the node's 80/443 are forwarded to them.
  ports:
    web:
      hostPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      hostPort: 443
  # hostPort exposes the entrypoints; no Service/LoadBalancer needed.
  service:
    enabled: false
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik
  providers:
    kubernetesIngress:
      enabled: true
      allowExternalNameServices: true
      # What Traefik writes into each Ingress's status (the ADDRESS column).
      # Normally taken from its Service, but there is none here. ArgoCD keeps
      # an Ingress "Progressing" until this is set.
      # The master's static public IP (`terraform output public_ip`). It only
      # changes if the cluster is rebuilt; update it here and in DNS then.
      ingressEndpoint:
        ip: 57.159.25.215
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
